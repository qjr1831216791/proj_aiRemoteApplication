[package]
name = "ai-remote-workbench"
version = "0.4.0"
description = "AI 远程工作台桌面控制台（CloudCLI/Caddy/EasyTier 组网生命周期控制面）"
edition = "2021"

[lib]
name = "ai_remote_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建标志（官方模板要求，DO NOT REMOVE）：
# tauri-macros 以 `cfg!(not(feature = "custom-protocol"))` 判定 dev——
# 缺此声明时 exe（含 release 编译）一律加载 devUrl(localhost:5173) 而非内嵌
# dist 资产，页面空白、前端 show 链路失效（T12 真机演练实测踩坑）。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
# 单实例：Windows 实现为 {identifier}-sim 互斥体（无 Global\ 前缀，仅会话内唯一），
# 跨会话唯一性由下方 windows crate 的 Global\ 互斥体补足（spec §4.5，见 src/single_instance.rs）
tauri-plugin-single-instance = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# T6 端口探测：netstat2 = GetExtendedTcpTable 取 TCP 监听端口与关联 PID
netstat2 = "0.9"
# T6 进程身份：PID → 可执行文件路径/名称（与监听者身份匹配，AC7 双重判据）
sysinfo = "0.33"
# spec 004 DNS 自动切换：腾讯云 DNS API（TC3-HMAC-SHA256 签名）+ HTTPS 客户端。
# ureq 轻量单二进制（rustls）；sha2/hmac 为 RustCrypto 成熟库，仅用于 TC3 签名
ureq = { version = "2", features = ["json", "tls"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
toml = "0.8"
local-ip-address = "0.6.13"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security", # CreateMutexW 的 SECURITY_ATTRIBUTES 参数所在模块
    "Win32_System_Threading",
    "Win32_UI_Shell", # T7 ShellExecuteW（runas 提权启动安装脚本）
    "Win32_UI_WindowsAndMessaging",
] }

# 发布体积优化（约束 §5：安装包 ≤15MB）
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
